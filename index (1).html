<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список справ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Список справ</h1>

        <!-- Поле вводу і кнопка додавання -->
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Нова справа...">
            <button id="addBtn">Додати</button>
        </div>

        <!-- Фільтри (додатково) -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Всі</button>
            <button class="filter-btn" data-filter="active">Активні</button>
            <button class="filter-btn" data-filter="done">Виконані</button>
        </div>

        <!-- Сюди JavaScript додає завдання -->
        <ul id="taskList"></ul>

        <!-- Лічильник і очищення (додатково) -->
        <div class="footer-bar">
            <span id="counter">Усього: 0 | Не виконано: 0</span>
            <button id="clearDoneBtn">Очистити виконані</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
